[platformio]
default_envs = robos3
src_dir = src

[env]
lib_ldf_mode = deep+
monitor_speed = 115200

[env:robos3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
board = esp32-s3-devkitc1-n8r2
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
lib_deps =
    Wire
    Preferences
    pololu/QTRSensors@4.0.0
    martinsos/HCSR04@2.0.0
    adafruit/Adafruit TCS34725@1.4.4
    adafruit/Adafruit BusIO@1.17.4
    electroniccats/MPU6050@1.4.4
    https://github.com/bytevoltateam/PIDEasy.git#PIDEasy-v1.0.2
build_src_filter = +<*> -<main.cpp>
build_flags =
    -DROBOS3_COMPILE_CHECK
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<modules/RoboMath.cpp>
lib_ignore =
    QTRSensors
    HCSR04
    Adafruit TCS34725
    MPU6050
    PIDEasy

[env:robos3_serial]
extends = env:robos3
build_flags =
    ${env:robos3.build_flags}
    -DROBOS3_CALIBRATION_SERIAL

[env:robos3_web]
extends = env:robos3
build_flags =
    ${env:robos3.build_flags}
    -DROBOS3_CALIBRATION_WEB

[env:robos3_calibration]
extends = env:robos3
build_flags =
    ${env:robos3.build_flags}
    -DROBOS3_CALIBRATION_WEB
    -DROBOS3_CALIBRATION_SERIAL

[env:examples]
extends = env:robos3
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src

[env:example_serial]
extends = env:examples
build_flags =
    ${env:examples.build_flags}
    -DROBOS3_CALIBRATION_SERIAL

[env:example_web]
extends = env:examples
build_flags =
    ${env:examples.build_flags}
    -DROBOS3_CALIBRATION_WEB

[env:unit]
extends = env:examples
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<modules/RoboMath.cpp>

[env:examples_all]
extends = env:examples
build_flags =
    ${env:examples.build_flags}
    -DROBOS3_EXAMPLES_COMPILE_CHECK
